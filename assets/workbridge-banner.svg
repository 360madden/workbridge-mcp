<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">Workbridge MCP — AI connected to your Windows workspace</title>
  <desc id="desc">A glowing connected bridge above a blue and violet network, with Workbridge MCP branding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="1" y2="0"><stop stop-color="#071326"/><stop offset=".58" stop-color="#101f3c"/><stop offset="1" stop-color="#22164a"/></linearGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#26d7e9"/><stop offset=".53" stop-color="#79a4ff"/><stop offset="1" stop-color="#ba82ff"/></linearGradient>
    <linearGradient id="pill" x1="0" x2="1"><stop stop-color="#163f56"/><stop offset="1" stop-color="#30285e"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#7894d3" stroke-opacity=".11"/></pattern>
  </defs>
  <rect width="1280" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="22" fill="url(#grid)"/>
  <circle cx="1040" cy="156" r="180" fill="#6152de" opacity=".09"/>
  <circle cx="1090" cy="130" r="116" fill="#1cd7e5" opacity=".08"/>
  <path d="M715 235H1230" stroke="#6381b3" stroke-opacity=".15"/>
  <path d="M732 220Q945 14 1172 220" fill="none" stroke="url(#beam)" stroke-opacity=".22" stroke-width="24" filter="url(#glow)"/>
  <path d="M732 220Q945 14 1172 220" fill="none" stroke="url(#beam)" stroke-width="7" stroke-linecap="round"/>
  <path d="M770 221V183M826 221V119M888 221V77M949 221V62M1011 221V81M1072 221V125M1131 221V186" stroke="#6e96d3" stroke-width="3" stroke-opacity=".52"/>
  <path d="M718 222H1190" stroke="#7092e9" stroke-width="7" stroke-linecap="round"/>
  <g fill="#0c2747" stroke="#57d6f6" stroke-width="4"><circle cx="732" cy="220" r="10"/><circle cx="949" cy="62" r="12"/><circle cx="1172" cy="220" r="10"/></g>
  <g fill="#a4efff"><circle cx="826" cy="119" r="5"/><circle cx="1072" cy="125" r="5"/></g>
