  <text x="56" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="69" font-weight="800" letter-spacing="-2" fill="#f4f8ff">WORKBRIDGE</text>
  <text x="61" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="33" font-weight="700" fill="#8cbdff">MCP</text>
  <text x="145" y="210" font-family="Segoe UI, Arial, sans-serif" font-size="22" fill="#d1dcef">•  Your AI-to-Windows development bridge</text>
