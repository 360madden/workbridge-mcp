name: Diagnose Windows-native fixtures

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-native-probe:
    name: Diagnostic only / Windows Node 24
    runs-on: windows-2025
    timeout-minutes: 6
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Use canonical runner temp
        shell: pwsh
        run: |
          "TMPDIR=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Isolate native Git and archive failures
        run: node investigations/ci-native-runner/native-probe.mjs
