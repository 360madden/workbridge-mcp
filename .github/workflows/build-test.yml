name: Build and Test

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'integrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Windows / Node 24 (${{ matrix.partition }})
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        partition: [parallel, isolated]
    steps:
      # GitHub's default TEMP may use an 8.3 RUNNER~1 alias; select a canonical root.
      - name: Set canonical Windows fixture temp
        shell: pwsh
        run: |
          "TMPDIR=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify canonical temporary fixture root
        shell: pwsh
        run: node -e "const os=require('node:os'),fs=require('node:fs'),path=require('node:path');const declared=path.resolve(os.tmpdir());const canonical=fs.realpathSync.native(declared);if(declared.toLowerCase()!==canonical.toLowerCase())throw new Error('CI_TEMP_ALIAS_MISMATCH')"
      # The two runner partitions cover every test/*.test.mjs file exactly once.
      # Full RIFT companion tests need local RRE/RPT tools; WB-001 runs
      # those unchanged on the verified physical development machine.
      - name: Build Workbridge and stage desktop runtime
        run: |
          npm run build
          node scripts/stage-desktop-runtime.mjs
      - name: Check native Git/archive prerequisites
        if: matrix.partition == 'isolated'
        run: node --test --test-concurrency=1 test/git-baseline-audit.test.mjs test/job-archive-proposal.test.mjs test/job-archive-write.test.mjs
      - name: Verify exhaustive core test partition
        run: node scripts/ci-core-test-runner.mjs inventory
      - name: Run complete core partition
        run: node scripts/ci-core-test-runner.mjs ${{ matrix.partition }}
      - name: Test both research providers with synthetic offline fixtures
        if: matrix.partition == 'parallel'
        run: node --test integrations/research/test/*.test.mjs
      - name: Verify the sealed research runtime closure
        if: matrix.partition == 'parallel'
        run: node scripts/stage-research-runtime.mjs --verify --repo-root .
