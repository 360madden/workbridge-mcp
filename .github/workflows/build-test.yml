name: Build and Test

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'integrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Windows / Node 24
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      # GitHub's default TEMP may use an 8.3 RUNNER~1 alias; select a canonical root.
      - name: Set canonical Windows fixture temp
        shell: pwsh
        run: |
          "TMPDIR=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
          "TEMP=$env:RUNNER_TEMP" >> $env:GITHUB_ENV
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify canonical temporary fixture root
        shell: pwsh
        run: node -e "const os=require('node:os'),fs=require('node:fs'),path=require('node:path');const declared=path.resolve(os.tmpdir());const canonical=fs.realpathSync.native(declared);if(declared.toLowerCase()!==canonical.toLowerCase())throw new Error('CI_TEMP_ALIAS_MISMATCH')"
      # On a hosted runner, use the complete original Workbridge core suite and
      # the portable research fixtures. The full RIFT companion tests additionally
      # require sibling RRE/RPT Python tools and real host archives; WB-001 runs
      # those unchanged on the verified Windows development machine.
      - name: Build and run Workbridge core tests
        run: |
          npm run build
          # The disposable CI checkout needs the same desktop helper closure as WB-001.
          node scripts/stage-desktop-runtime.mjs
          # Check the native Git/archive fixtures alone to distinguish host prerequisites
          # from contention; the complete core suite still runs below, unchanged.
          node --test --test-concurrency=1 test/git-baseline-audit.test.mjs test/job-archive-proposal.test.mjs test/job-archive-write.test.mjs
          # Match WB-001's proven bounded file scheduler without omitting any tests.
          node --test --test-concurrency=4 test/*.test.mjs
      - name: Test both research providers with synthetic offline fixtures
        run: node --test integrations/research/test/*.test.mjs
      - name: Verify the sealed research runtime closure
        run: node scripts/stage-research-runtime.mjs --verify --repo-root .
