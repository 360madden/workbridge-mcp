name: Build and Test

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'scripts/**'
      - 'integrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/build-test.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Windows / Node 24
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      # On a hosted runner, use the complete original Workbridge core suite and
      # the portable research fixtures. The full RIFT companion tests additionally
      # require sibling RRE/RPT Python tools and real host archives; WB-001 runs
      # those unchanged on the verified Windows development machine.
      - name: Build and run Workbridge core tests
        run: |
          npm run build
          node --test test/*.test.mjs
      - name: Test both research providers with synthetic offline fixtures
        run: node --test integrations/research/test/*.test.mjs
      - name: Verify the sealed research runtime closure
        run: node scripts/stage-research-runtime.mjs --verify --repo-root .
